name: Cloudflare Lab read-only connection check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lab-connection-check.yml']
  workflow_dispatch:
permissions: {}
jobs:
  read-only:
    if: github.repository == '19wolfalone92/Execution-Guard-Lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check lab credentials and read access without revealing values
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          token = os.environ.get("CF_TOKEN", "").strip()
          account = os.environ.get("CF_ACCOUNT", "").strip()
          print("API_TOKEN_PRESENT=" + str(bool(token)).lower())
          print("ACCOUNT_ID_PRESENT=" + str(bool(account)).lower())
          valid = bool(re.fullmatch(r"[a-fA-F0-9]{32}", account))
          print("ACCOUNT_ID_FORMAT_VALID=" + str(valid).lower())
          if not token or not valid:
              sys.exit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          root = "https://api.cloudflare.com/client/v4"
          prefix = "/accounts/" + account
          def probe(label, path, check=lambda result: True):
              try:
                  request = urllib.request.Request(root + path, headers={"Authorization": "Bearer " + token, "Accept": "application/json"}, method="GET")
                  with opener.open(request, timeout=12) as response:
                      status = response.status
                      body = json.loads(response.read(2_000_001))
                  ok = status == 200 and isinstance(body, dict) and body.get("success") is True and check(body.get("result"))
                  print(f"{label}={'PASS' if ok else 'FAIL'} HTTP={status}")
                  return ok
              except urllib.error.HTTPError as error:
                  codes = []
                  try:
                      payload = json.loads(error.read(65536))
                      codes = [str(x["code"]) for x in payload.get("errors", []) if isinstance(x, dict) and isinstance(x.get("code"), int)][:8]
                  except Exception:
                      pass
                  print(f"{label}=FAIL HTTP={error.code} ERROR_CODES={','.join(codes) or 'none'}")
              except Exception:
                  print(f"{label}=UNVERIFIED TRANSPORT_OR_PARSE_ERROR")
              return False
          token_path = prefix + "/tokens/verify" if token.startswith("cfat_") else "/user/tokens/verify"
          identity = {}
          def capture_token(result):
              if not isinstance(result, dict):
                  return False
              identity["id"] = result.get("id")
              from datetime import datetime, timezone
              expiry = result.get("expires_on")
              print("VERIFY_EXPIRY_PRESENT=" + str(bool(expiry)).lower())
              if isinstance(expiry, str):
                  try:
                      expires = datetime.fromisoformat(expiry.replace("Z", "+00:00"))
                      seconds = (expires - datetime.now(timezone.utc)).total_seconds()
                      print("VERIFY_EXPIRY_UTC=" + expires.astimezone(timezone.utc).isoformat())
                      print("VERIFY_EXPIRY_WITHIN_31_DAYS=" + str(0 < seconds <= 31*86400).lower())
                  except (ValueError, TypeError):
                      print("VERIFY_EXPIRY_PARSE=UNVERIFIED")
              return result.get("status") == "active"
          active = probe("TOKEN_ACTIVE", token_path, capture_token)
          matched = probe("ACCOUNT_MATCH", prefix, lambda x: isinstance(x, dict) and str(x.get("id", "")).lower() == account.lower())
          if not active or not matched:
              sys.exit(1)
          workers = probe("WORKERS_LIST_READ", prefix + "/workers/scripts", lambda x: isinstance(x, list))
          probe("WORKERS_SUBDOMAIN_READ", prefix + "/workers/subdomain")
          def check_account_list(result):
              if not isinstance(result, list):
                  return False
              ids = {str(x.get("id", "")).lower() for x in result if isinstance(x, dict)}
              print("VISIBLE_ACCOUNTS_FIRST_PAGE_COUNT=" + str(len(ids)))
              print("VISIBLE_ACCOUNTS_FIRST_PAGE_TARGET_ONLY=" + str(ids == {account.lower()}).lower())
              return account.lower() in ids
          probe("ACCOUNT_LIST_READ", "/accounts?per_page=50", check_account_list)
          probe("OPTIONAL_KV_READ", prefix + "/storage/kv/namespaces")
          probe("OPTIONAL_D1_READ", prefix + "/d1/database")
          print("DIAGNOSTIC_REVISION=restricted_token_recheck_v3")
          probe("OPTIONAL_R2_READ", prefix + "/r2/buckets")
          known_groups = {
              "WORKERS_WRITE": {"workers scripts write", "workers scripts edit"},
              "WORKERS_READ": {"workers scripts read"},
              "WORKERS_TAIL": {"workers tail read"},
              "KV_WRITE": {"workers kv storage write", "workers kv storage edit"},
              "KV_READ": {"workers kv storage read"},
              "D1_WRITE": {"d1 write", "d1 edit"},
              "R2_WRITE": {"workers r2 storage write", "workers r2 storage edit"},
              "ACCOUNT_READ": {"account settings read"},
              "WORKERS_CI_WRITE": {"workers ci write", "workers ci edit"},
          }
          def inspect_policy(result):
              if not isinstance(result, dict) or not isinstance(result.get("policies"), list):
                  return False
              for key, names in known_groups.items():
                  matching = [p for p in result["policies"] if isinstance(p, dict) and any(isinstance(g, dict) and str(g.get("name", "")).lower() in names for g in p.get("permission_groups", []))]
                  allow = any(p.get("effect") == "allow" for p in matching)
                  deny = any(p.get("effect") == "deny" for p in matching)
                  print(f"DECLARED_{key}={'ALLOW_PRESENT' if allow else 'NOT_FOUND'} DENY_PRESENT={str(deny).lower()}")
              allow_policies = [p for p in result["policies"] if isinstance(p, dict) and p.get("effect") == "allow"]
              def classify_resources(policy):
                  resources = policy.get("resources")
                  if not isinstance(resources, dict):
                      return {"unrecognized"}
                  kinds = set()
                  for raw in resources:
                      name = str(raw).lower()
                      if name == "com.cloudflare.api.account." + account.lower():
                          kinds.add("target_account")
                      elif name in {"com.cloudflare.api.account.*", "com.cloudflare.api.account", "*"}:
                          kinds.add("broad_or_unspecified")
                      elif re.fullmatch(r"com\.cloudflare\.api\.account\.[a-f0-9]{32}", name):
                          kinds.add("different_account")
                      elif name.startswith("com.cloudflare.api.user"):
                          kinds.add("user_scope")
                      else:
                          kinds.add("unrecognized")
                  return kinds or {"unrecognized"}
              for key, names in known_groups.items():
                  matching = [p for p in allow_policies if any(isinstance(g, dict) and str(g.get("name", "")).lower() in names for g in p.get("permission_groups", []))]
                  kinds = set().union(*(classify_resources(p) for p in matching)) if matching else set()
                  print(f"SCOPE_{key}={','.join(sorted(kinds)) or 'not_found'}")
              kinds = set().union(*(classify_resources(p) for p in allow_policies)) if allow_policies else set()
              print("ALL_ALLOW_RESOURCE_CLASSES=" + (",".join(sorted(kinds)) or "not_found"))
              print("TOKEN_EXPIRY_CONFIGURED=" + str(bool(result.get("expires_on"))).lower())
              condition = result.get("condition") or {}
              print("TOKEN_IP_FILTER_CONFIGURED=" + str(bool(condition.get("request_ip")) if isinstance(condition, dict) else False).lower())
              print("TOKEN_POLICY_SCOPE_METADATA_PRESENT=true")
              known_names = set().union(*known_groups.values())
              expected = set().union(*(known_groups[k] for k in ("WORKERS_WRITE", "WORKERS_READ", "WORKERS_TAIL", "KV_WRITE", "KV_READ", "ACCOUNT_READ")))
              granted = {str(g.get("name", "")).lower() for p in allow_policies for g in p.get("permission_groups", []) if isinstance(g, dict)}
              extra = granted - expected
              print("UNEXPECTED_ALLOW_GROUP_COUNT=" + str(len(extra)))
              print("UNKNOWN_ALLOW_GROUP_COUNT=" + str(len(granted - known_names)))
              print("TARGET_ACCOUNT_ONLY=" + str(bool(allow_policies) and kinds == {"target_account"}).lower())
              print("BASELINE_REQUIRED_GROUPS_PRESENT=" + str(all(bool(granted & known_groups[k]) for k in ("WORKERS_WRITE", "ACCOUNT_READ"))).lower())
              print("POLICY_MINIMUM_SCOPE_CHECK=" + ("PASS" if allow_policies and kinds == {"target_account"} and not extra and bool(result.get("expires_on")) and all(bool(granted & known_groups[k]) for k in ("WORKERS_WRITE", "ACCOUNT_READ")) else "NOT_CONFIRMED"))
              return True
          token_id = identity.get("id")
          if isinstance(token_id, str) and re.fullmatch(r"[a-fA-F0-9]{32}", token_id):
              details_path = (prefix + "/tokens/" if token.startswith("cfat_") else "/user/tokens/") + token_id
              policy_read = probe("TOKEN_POLICY_READ", details_path, inspect_policy)
              if not policy_read:
                  print("POLICY_MINIMUM_SCOPE_CHECK=UNVERIFIED_POLICY_NOT_READABLE")
          else:
              print("TOKEN_POLICY_READ=UNVERIFIED_NO_TOKEN_ID")
          print("WRITE_PERMISSIONS=UNVERIFIED_READ_ONLY_CHECK")
          sys.exit(0 if workers else 1)
          PY
