name: Lab 0.9.0 one-shot HTTPS diagnostic

on:
  push:
    branches:
      - qualification/cloud-runtime-oauth-20261127
    paths:
      - qualification-patches/https-diagnostic-ready.txt

permissions:
  contents: read

concurrency:
  group: lab-0.9.0-https-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == '19wolfalone92/Execution-Guard-Lab' && github.ref == 'refs/heads/qualification/cloud-runtime-oauth-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the authorized candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'

      - name: Bind evidence to the immediately preceding source candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD^)"
          printf 'CANDIDATE_SHA=%s\n' "$candidate_sha" >> "$GITHUB_ENV"
          printf 'Candidate source SHA: %s\n' "$candidate_sha"

      - name: Perform one guarded HTTPS diagnostic and cleanup
        id: diagnostic
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSTIC_EVIDENCE_PATH: ${{ runner.temp }}/evidence/diagnostic-evidence.json
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence"
          set +e
          python cloud_runtime/write_probe.py
          result=$?
          printf '%s\n' "$result" > "${RUNNER_TEMP}/evidence/diagnostic-exit-code.txt"
          echo "diagnostic_exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized HTTPS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-guard-lab-0.9.0-https-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
