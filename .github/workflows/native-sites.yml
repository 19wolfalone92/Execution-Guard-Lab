name: Lab native Sites qualification
on:
  push:
    branches: ['release/native-sites-1.0.0']
    paths: ['sites/**', '.github/workflows/native-sites.yml']
  pull_request:
    paths: ['sites/**', '.github/workflows/native-sites.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sites/package-lock.json
      - name: Verify source and build the pinned reactor
        run: |
          python -m pip install --require-hashes -r ../requirements.lock
          python -B scripts/verify-source.py
          python -B scripts/prepare.py
          npm ci --ignore-scripts --no-fund
          npm run build
      - name: Qualify transport, admission and Python equivalence
        run: |
          mkdir -p .evidence
          set -o pipefail
          npm test | tee .evidence/TRANSPORT.txt
          npm run qualify
          npm audit --json > .evidence/NPM-AUDIT.json
          sha256sum dist/server/* > .evidence/BUILD-SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-native-sites-${{ github.sha }}
          path: sites/.evidence/
          include-hidden-files: true
