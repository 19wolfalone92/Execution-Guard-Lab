name: Lab 0.5.0 local Workers runtime qualification
on:
  push:
    branches: ['qualification/cloud-runtime-oauth-20261127']
    paths: ['cloud_runtime/**', '.github/workflows/cloud-runtime-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-runtime:
    if: github.repository == '19wolfalone92/Execution-Guard-Lab' && github.ref == 'refs/heads/qualification/cloud-runtime-oauth-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - name: Install baseline hashes and qualification CLI
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install 'uv==0.13.4' 'pip-audit==2.10.1'
      - name: Native reference and unchanged source verification
        run: |
          python scripts/verify_manifest.py MANIFEST_0.4.0.sha256
          python cloud_runtime/qualify.py --output cloud-native.json
          python cloud_runtime/qualify.py --prepare --output /dev/null
      - name: Start official Python Workers local runtime (no cloud credentials)
        working-directory: cloud_runtime
        run: |
          uv lock
          uv run --locked pywrangler --version
          uv run --locked pywrangler dev --local --ip 127.0.0.1 --port 8789 > ../workerd.log 2>&1 &
          echo $! > ../workerd.pid
          for i in $(seq 1 90); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8789/health | grep -Fxq qualification-only; then exit 0; fi
            if ! kill -0 "$(cat ../workerd.pid)" 2>/dev/null; then tail -80 ../workerd.log; exit 1; fi
            sleep 2
          done
          tail -80 ../workerd.log
          exit 1
      - name: Compare all 69 synthetic vectors plus parallel calls
        run: python cloud_runtime/qualify.py --url http://127.0.0.1:8789 --output cloud-workerd.json
      - name: Audit the actual Pyodide dependency graph
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          packages=tomllib.loads(Path('cloud_runtime/pylock.toml').read_text())['packages']
          assert packages and all(p.get('name') and p.get('version') for p in packages)
          Path('cloud-worker-pins.txt').write_text(''.join(f"{p['name']}=={p['version']}\n" for p in packages))
          PY
          pip-audit --strict --no-deps --disable-pip --format json --output cloud-worker-audit.json -r cloud-worker-pins.txt
      - name: Stop probe
        if: always()
        run: |
          if test -f workerd.pid; then kill "$(cat workerd.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-local-runtime-${{ github.sha }}
          if-no-files-found: warn
          path: |
            cloud-native.json
            cloud-workerd.json
            workerd.log
            cloud_runtime/uv.lock
            cloud_runtime/pylock.toml
            cloud-worker-pins.txt
            cloud-worker-audit.json
