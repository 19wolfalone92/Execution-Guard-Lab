name: Lab 0.7.0 integrated local MCP qualification
on:
  push:
    branches: ['qualification/cloud-runtime-oauth-20261127']
    paths: ['integrated/**','diagnostics/**','.github/workflows/integrated-local-qualification.yml']
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - name: Install qualified dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install 'uv==0.13.4'
          cd oauth_runtime
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high --json > ../integrated-npm-audit.json
      - name: Diagnostics offline and prepare unchanged kernel
        run: |
          python -m pytest -q diagnostics cloud_runtime/test_write_probe.py integrated/tests/test_optimized.py integrated/tests/test_key_rotation.py
          node --test oauth_runtime/identity.test.mjs integrated/gateway/transport.test.mjs integrated/gateway/admission.test.mjs
          python integrated/tests/benchmark.py native-resource-comparison.json
          python integrated/tests/profile_ast.py ast-profile.json
          cp lab.py extensions.py integrated/core/src/
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' -keyout "$RUNNER_TEMP/lab-key.pem" -out "$RUNNER_TEMP/lab-cert.pem"
      - name: Launch Python core locally (loopback only)
        run: |
          cd integrated/core
          uv lock
          uv run --locked pywrangler dev --local --ip 127.0.0.1 --port 8791 > ../../integrated-core.log 2>&1 &
          echo $! > "$RUNNER_TEMP/core.pid"
          for i in $(seq 1 90); do
            if curl -s --max-time 2 http://127.0.0.1:8791/ -o /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Launch OAuth gateway with local service binding and TLS
        run: |
          oauth_runtime/node_modules/.bin/wrangler dev --config integrated/gateway/wrangler.jsonc --local --ip 127.0.0.1 --port 8790 --local-protocol https --https-key-path "$RUNNER_TEMP/lab-key.pem" --https-cert-path "$RUNNER_TEMP/lab-cert.pem" > integrated-gateway.log 2>&1 &
          echo $! > "$RUNNER_TEMP/gateway.pid"
          for i in $(seq 1 90); do
            if curl --cacert "$RUNNER_TEMP/lab-cert.pem" --fail --silent --max-time 2 https://127.0.0.1:8790/.well-known/oauth-authorization-server -o /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Official SDK through OAuth and Python core
        run: python integrated/tests/qualify.py "$RUNNER_TEMP/lab-cert.pem"
      - name: Stop local processes
        if: always()
        run: |
          for f in "$RUNNER_TEMP/core.pid" "$RUNNER_TEMP/gateway.pid"; do if test -f "$f"; then kill "$(cat "$f")" 2>/dev/null || true; fi; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-integrated-${{ github.sha }}
          path: |
            integrated-evidence.json
            integrated-npm-audit.json
            native-resource-comparison.json
            ast-profile.json
            integrated/core/uv.lock
            integrated/core/pylock.toml
          if-no-files-found: warn
