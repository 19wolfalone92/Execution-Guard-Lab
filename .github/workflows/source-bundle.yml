name: Lab 0.8.0 candidate exact source and resource evidence
on:
  push:
    branches: ['qualification/cloud-runtime-oauth-20261127']
    paths: ['benchmarks/**','diagnostics/**','cloud_runtime/**','reports/0.8.0/**','.github/workflows/source-bundle.yml']
permissions:
  contents: read
jobs:
  source-evidence:
    if: github.repository == '19wolfalone92/Execution-Guard-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - name: Reproduce native all-tool evidence using locked graph
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python benchmarks/all_tools.py all-tools.json
          if python integrated/preflight.py > production-hold.json; then exit 1; fi
          python -c "import json; d=json.load(open('production-hold.json')); assert d['status']=='BLOCKED' and all(d['local'].values()) and not d['release_allowed']"
      - name: Exact reproducible source from immutable Git tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=zip --prefix=source/ "$GITHUB_SHA" > source.zip
          git archive --format=zip --prefix=source/ "$GITHUB_SHA" > source-repeat.zip
          cmp source.zip source-repeat.zip
          git ls-tree -r --full-tree "$GITHUB_SHA" > source-tree.txt
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          sha256sum source.zip > source.zip.sha256
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          rows={p.split('\t',1)[1]:p.split('\t',1)[0].split()[2] for p in Path('source-tree.txt').read_text().splitlines()}
          with zipfile.ZipFile('source.zip') as z:
              assert z.testzip() is None
              names={p.removeprefix('source/') for p in z.namelist() if not p.endswith('/')}
              assert names==set(rows)
              for name,digest in rows.items():
                  b=z.read('source/'+name); assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==digest,name
          print(f'{len(rows)} exact source blobs verified; two git archives byte-identical')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-0.8.0-candidate-source-evidence-${{ github.sha }}
          path: |
            source.zip
            source.zip.sha256
            source-tree.txt
            source-commit.txt
            all-tools.json
            all-tools.csv
            production-hold.json
