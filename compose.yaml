services:
  execution-guard-lab:
    build: .
    restart: unless-stopped
    env_file: lab.env
    environment:
      LAB_BIND: 0.0.0.0
      LAB_PORT: '8443'
      LAB_PUBLIC_KEY_FILE: /run/lab-keys/issuer-public.pem
      LAB_TLS_CERT: /run/lab-keys/tls-fullchain.pem
      LAB_TLS_KEY: /run/lab-keys/tls-private.pem
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./lab-keys:/run/lab-keys:ro
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 256
        hard: 256
    stop_grace_period: 15s
